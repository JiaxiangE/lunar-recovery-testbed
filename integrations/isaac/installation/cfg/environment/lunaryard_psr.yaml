name: Lunaryard
seed: 42
physics_dt: 0.0333
rendering_dt: 0.0333
enforce_realtime: true
lunaryard_settings:
  lab_length: 200.0
  lab_width: 200.0
  resolution: 0.25
  coordinates:
    latitude: -89.9
    longitude: 0.0
  terrain_id: 0
stellar_engine_settings: null
sun_settings:
  intensity: 2200.0
  angle: 0.53
  diffuse_multiplier: 1.0
  specular_multiplier: 1.0
  color:
  - 1.0
  - 1.0
  - 1.0
  temperature: 6500.0
  azimuth: 200.0
  elevation: 13.0
rocks_settings:
  enable: false
  instancers_path: /Lunaryard/Rocks
  rocks_settings:
    medium_rocks:
      seed: ${....seed}
      collections:
      - apollo_rocks
      use_point_instancer: true
      requests:
        req_pos_xy:
          attribute: Position
          axes:
          - x
          - y
          layer:
            name: Image
            mpp_resolution: ${.......lunaryard_settings.resolution}
            output_space: 2
          sampler:
            name: ThomasCluster
            randomization_space: 2
            lambda_parent: 0.25
            lambda_daughter: 50
            sigma: 0.2
            seed: ${.......seed}
        req_pos_z:
          attribute: Position
          axes:
          - z
          layer:
            name: Image
            output_space: 1
          sampler:
            name: Image
            randomization_space: 1
            mpp_resolution: ${.......lunaryard_settings.resolution}
        req_random_z_rot:
          attribute: Orientation
          axes:
          - x
          - y
          - z
          - w
          layer:
            name: RollPitchYaw
            rmax: 0
            rmin: 0
            pmax: 0
            pmin: 0
            ymax: 6.28318530718
            ymin: 0
          sampler:
            name: Uniform
            randomization_space: 3
            seed: ${.......seed}
        req_scale:
          attribute: Scale
          axes:
          - xyz
          layer:
            name: Line
            xmin: 1.0
            xmax: 1.0
          sampler:
            name: Uniform
            randomization_space: 1
            seed: ${.......seed}
    large_rocks:
      seed: ${....seed}
      collections:
      - apollo_rocks
      use_point_instancer: true
      parent: medium_rocks
      requests:
        req_pos_xy:
          attribute: Position
          axes:
          - x
          - y
          layer:
            name: Image
            mpp_resolution: ${.......lunaryard_settings.resolution}
            output_space: 2
          sampler:
            name: ThomasCluster
            randomization_space: 2
            lambda_parent: 0.25
            lambda_daughter: 5
            sigma: 0.05
            inherit_parents: true
            seed: ${.......seed}
        req_pos_z:
          attribute: Position
          axes:
          - z
          layer:
            name: Image
            output_space: 1
          sampler:
            name: Image
            randomization_space: 1
            mpp_resolution: ${.......lunaryard_settings.resolution}
        req_random_z_rot:
          attribute: Orientation
          axes:
          - x
          - y
          - z
          - w
          layer:
            name: RollPitchYaw
            rmax: 0
            rmin: 0
            pmax: 0
            pmin: 0
            ymax: 6.28318530718
            ymin: 0
          sampler:
            name: Uniform
            randomization_space: 3
            seed: ${.......seed}
        req_scale:
          attribute: Scale
          axes:
          - xyz
          layer:
            name: Line
            xmin: 2.0
            xmax: 5.0
          sampler:
            name: Uniform
            randomization_space: 1
            seed: ${.......seed}
    small_rocks:
      seed: ${....seed}
      collections:
      - apollo_rocks
      use_point_instancer: true
      parent: medium_rocks
      requests:
        req_pos_xy:
          attribute: Position
          axes:
          - x
          - y
          layer:
            name: Image
            mpp_resolution: ${.......lunaryard_settings.resolution}
            output_space: 2
          sampler:
            name: ThomasCluster
            randomization_space: 2
            lambda_parent: 0.5
            lambda_daughter: 500
            sigma: 0.3
            inherit_parents: true
            seed: ${.......seed}
        req_pos_z:
          attribute: Position
          axes:
          - z
          layer:
            name: Image
            output_space: 1
          sampler:
            name: Image
            randomization_space: 1
            mpp_resolution: ${.......lunaryard_settings.resolution}
        req_random_z_rot:
          attribute: Orientation
          axes:
          - x
          - y
          - z
          - w
          layer:
            name: RollPitchYaw
            rmax: 0
            rmin: 0
            pmax: 0
            pmin: 0
            ymax: 6.28318530718
            ymin: 0
          sampler:
            name: Uniform
            randomization_space: 3
            seed: ${.......seed}
        req_scale:
          attribute: Scale
          axes:
          - xyz
          layer:
            name: Line
            xmin: 0.01
            xmax: 0.05
          sampler:
            name: Uniform
            randomization_space: 1
            seed: ${.......seed}
terrain_manager:
  moon_yard:
    crater_generator:
      profiles_path: assets/Terrains/crater_spline_profiles.pkl
      min_xy_ratio: 0.85
      max_xy_ratio: 1.0
      resolution: ${....lunaryard_settings.resolution}
      pad_size: 500
      random_rotation: true
      z_scale: 0.5
      seed: ${....seed}
    crater_distribution:
      x_size: ${....lunaryard_settings.lab_length}
      y_size: ${....lunaryard_settings.lab_width}
      densities:
      - 0.025
      - 0.05
      - 0.5
      radius:
      - - 1.5
        - 2.5
      - - 0.75
        - 1.5
      - - 0.25
        - 0.5
      num_repeat: 1
      seed: ${....seed}
    base_terrain_generator:
      x_size: ${....lunaryard_settings.lab_length}
      y_size: ${....lunaryard_settings.lab_width}
      resolution: ${....lunaryard_settings.resolution}
      max_elevation: 0.5
      min_elevation: -0.5
      z_scale: 0.5
      seed: ${....seed}
    deformation_engine:
      enable: false
      delay: 2.0
      terrain_width: ${....lunaryard_settings.lab_width}
      terrain_height: ${....lunaryard_settings.lab_length}
      terrain_resolution: ${....lunaryard_settings.resolution}
      footprint:
        width: 0.25
        height: 0.1
      deform_constrain:
        x_deform_offset: 0.0
        y_deform_offset: 0.0
        deform_decay_ratio: 0.01
      boundary_distribution:
        distribution: trapezoidal
        angle_of_repose: 1.047
      depth_distribution:
        distribution: sinusoidal
        wave_frequency: 4.14
      force_depth_regression:
        amplitude_slope: 6.0e-05
        amplitude_intercept: 0.008
        mean_slope: -0.00046
        mean_intercept: -0.0013
      num_links: 4
    is_yard: true
    is_lab: false
  root_path: /Lunaryard
  texture_path: /Lunaryard/Looks/Basalt
  dems_path: Terrains/Lunaryard
  mesh_position:
  - 0
  - 0
  - 0
  mesh_orientation:
  - 0
  - 0
  - 0
  - 1
  mesh_scale:
  - 1
  - 1
  - 1
  sim_length: ${..lunaryard_settings.lab_length}
  sim_width: ${..lunaryard_settings.lab_width}
  resolution: ${..lunaryard_settings.resolution}
